<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maverick - A Good Boy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Maverick</h1>
            <p class="hero-subtitle">Living his best life, one adventure at a time</p>
        </div>
    </div>

    <main class="container">
        <section class="intro">
            <p class="intro-text">Welcome to Maverick's world! Here are some of his favorite moments captured on camera.</p>
        </section>

        <section class="gallery" id="gallery">
            <!-- Gallery will be populated by JavaScript -->
        </section>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next">&#8250;</button>
        <img class="lightbox-image" id="lightbox-image" src="" alt="Maverick">
    </div>

    <footer class="footer">
        <p>&copy; 2025 Maverick's Adventures</p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
